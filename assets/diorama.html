<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diorama AstroSeec</title>
<meta name="description" content="Un momento con Dios cada día.">
<meta name="theme-color" content="#f3e8d2">
<style>
:root{
  --cream:#f3e8d2;
  --sage:#9bb89b;
  --moss:#5f7f5b;
  --teal:#274e52;
  --ochre:#d9a45b;
  --orange:#c8642d;
  --ink:#3b2b1d;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",P052,"URW Palladio L",Georgia,serif;
  --shade:rgba(58,38,18,.34);
  --edge:rgba(255,250,236,.5);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#f3e8d2;color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
/* Escena ESTÁTICA: el dibujo no se anima; solo cambian el cartel y los botones. */
.stage{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.sky{position:absolute;inset:0;background:radial-gradient(120% 75% at 70% 22%,#fbf3e1 0%,#f3e8d2 42%,#ecd9b4 100%)}
.sky-grain{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.layer{position:absolute;left:0;top:0;pointer-events:none}
.layer>svg{display:block;overflow:visible}
.cut{filter:drop-shadow(0 -1px 0 var(--edge)) drop-shadow(0 calc(var(--sh,4) * 1px) calc(var(--sh,4) * 1.5px) var(--shade))}
.grain{fill:url(#grainPat);pointer-events:none}
.c-far{fill:#dfdec3}
.c-hill{fill:#bdcfb2}
.c-roof{fill:#a8bd9c}
.c-win{fill:#8aa083}
.c-ridge{fill:#9bb89b}
.c-meadow{fill:#7e9c74}
.c-river{fill:#b7d2c8}
.c-ripple{fill:#f1f2e3}
.c-moss{fill:#5f7f5b}
.c-teal{fill:#274e52}
.c-ground{fill:#d9a45b}
.c-burrow{fill:#4a3019}
.c-stem{fill:#f0e3c6}
.c-cap{fill:#c8642d}
.c-dot{fill:#f8efdc}
.c-fern{fill:#5f7f5b}
.c-fall1{fill:#c9713a}
.c-fall2{fill:#b98f4c}
.c-tuft{fill:#8a9a55}
.c-pebble{fill:#e9dcc0}
.c-fg{fill:#1f4245}
.c-fg2{fill:#3d6a50}
.c-bell{fill:#c8642d}
.c-bell2{fill:#efc27d}
.c-mat{fill:#efe3c9}
.c-frame{fill:#1c3739}
.c-fox{fill:#c8642d}
.c-foxc{fill:#f6ecd6}
.c-foxd{fill:#3a2b24}
.glowdots{filter:url(#softGlow)}
.hang{position:absolute;top:0}
.hang .string{position:absolute;left:50%;top:0;width:1px;margin-left:-.5px;height:var(--len);background:linear-gradient(rgba(74,54,34,.25),rgba(74,54,34,.6))}
.hang .obj{position:absolute;left:50%;top:var(--len);transform:translate(-50%,-6%);filter:drop-shadow(0 5px 6px var(--shade))}
.hang .obj svg{display:block;overflow:visible}
.vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 16vmin rgba(60,36,14,.22)}
/* ── Cartel colgante de Oración Diaria: título + texto de intro rotativo ── */
.tag-wrap{position:fixed;top:0;left:clamp(26px,5.2vw,86px);z-index:10;transform:rotate(-2.2deg);transform-origin:50% 0;pointer-events:none;filter:drop-shadow(2px 10px 9px var(--shade))}
.tag-string{display:block;margin:0 auto;width:1px;height:clamp(26px,5vh,54px);background:linear-gradient(rgba(74,54,34,.2),rgba(74,54,34,.7))}
.tag{position:relative;width:clamp(256px,25vw,330px);padding:44px 22px 20px;text-align:center;pointer-events:auto;
  background:#f8efdb;color:var(--ink);
  clip-path:polygon(24% 0,76% 0,100% 16%,100% 100%,0 100%,0 16%)}
.tag-grain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tag>p,.tag>h1,.tag>.rule,.tag>div{position:relative}
.tag::after{content:"";position:absolute;inset:7px;border:1px dashed rgba(122,78,40,.35);clip-path:polygon(23% 0,77% 0,100% 15%,100% 100%,0 100%,0 15%);pointer-events:none}
.tag-hole{position:absolute;left:50%;top:13px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#1f3a3c}
.tag-knot{position:absolute;left:50%;top:-2px;width:1px;height:23px;margin-left:-.5px;background:rgba(74,54,34,.7)}
.tag h1{margin:0;font-weight:400;font-size:clamp(31px,3vw,42px);line-height:.96;letter-spacing:-.01em;padding-top:6px}
.tag h1 em{display:block;font-style:italic;color:var(--orange);font-size:1.12em;letter-spacing:0}
.tag .sub{margin:12px auto 0;max-width:24ch;font-size:13.5px;line-height:1.42;font-style:italic;color:#5b4632}
.rule{display:block;width:44px;height:6px;margin:12px auto 0;background:radial-gradient(circle,var(--moss) 1.4px,transparent 1.8px) 0 50%/9px 6px repeat-x}
.intro{margin:12px auto 0;min-height:6.2em;font-size:14px;line-height:1.5;font-style:italic;color:#4c3a28;transition:opacity .45s ease,transform .45s ease}
.intro.out{opacity:0;transform:translateY(-7px)}
.tbtn{appearance:none;border:0;font:inherit;cursor:pointer;width:42px;height:42px;flex:none;display:grid;place-items:center;color:#9a5526;background:transparent;
  clip-path:polygon(0 22%,78% 0,100% 78%,22% 100%);
  box-shadow:inset 0 0 0 2px rgba(122,78,40,.35);transition:transform .25s cubic-bezier(.3,1.6,.5,1),color .3s ease,box-shadow .3s ease}
.tbtn:hover{transform:scale(1.1) rotate(4deg);color:var(--orange);box-shadow:inset 0 0 0 2px rgba(122,78,40,.7)}
.tbtn:active{transform:scale(.94)}
.tbtn:focus-visible{outline:2px dashed #fff6df;outline-offset:3px;box-shadow:inset 0 0 0 2px var(--orange)}
.tbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tdots{display:flex;gap:7px}
.tdots i{width:7px;height:7px;border-radius:50%;background:rgba(122,78,40,.3);transition:background-color .35s ease,transform .35s ease}
.tdots i.on{background:var(--orange);transform:scale(1.25)}
/* ── Controles inferiores: Comenzar / Continuar con Google / Cargando ── */
.controls{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));z-index:11;display:flex;flex-direction:column;align-items:center;gap:9px}
.row{display:flex;gap:12px;align-items:center}
.pager{display:flex;align-items:center;gap:14px}
.chip{appearance:none;display:inline-flex;width:max-content;white-space:nowrap;align-items:center;gap:10px;padding:10px 16px 10px 12px;border:0;font:inherit;font-size:15px;color:var(--ink);cursor:pointer;background:#f8efdb;
  clip-path:polygon(2% 6%,30% 0,62% 4%,99% 1%,100% 52%,98% 96%,64% 100%,34% 97%,1% 100%,0 48%);
  filter:drop-shadow(0 4px 5px var(--shade));transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.chip:hover{transform:translateY(-2px) rotate(-1deg)}
.chip:active{transform:translateY(1px) scale(.98)}
.chip:focus-visible{outline:none;background:#fff7e4;box-shadow:inset 0 0 0 2px var(--orange)}
.chip.busy{pointer-events:none;opacity:.72}
.chip-label{min-width:3.6em;text-align:left;font-style:italic}
.start-chip{background:#c8642d;color:#fff6df;font-weight:600}
.load-chip{cursor:default}
.load-chip .dots3{display:inline-flex;gap:3px;margin-left:4px}
.load-chip .dots3 i{width:4px;height:4px;border-radius:50%;background:var(--ink);animation:dotp 1.2s ease-in-out infinite}
.load-chip .dots3 i:nth-child(2){animation-delay:.18s}
.load-chip .dots3 i:nth-child(3){animation-delay:.36s}
@keyframes dotp{0%,100%{opacity:.25}45%{opacity:1}}
.ver{position:fixed;left:14px;bottom:10px;z-index:9;margin:0;font-size:11px;font-style:italic;color:rgba(74,54,34,.55)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.defs{position:absolute;width:0;height:0;overflow:hidden}
@media (max-width:640px){
  .tag-wrap{left:calc(50% - 133px)}
  .tag{width:266px;padding:40px 16px 16px}
  .tag h1{font-size:31px}
  .tag .sub{font-size:12.5px}
  .intro{font-size:13.5px;min-height:6.8em}
  .chip{font-size:14px;padding:9px 14px 9px 10px}
}
@media (prefers-reduced-motion:reduce){
  .intro{transition-duration:.01ms}
  .load-chip .dots3 i{animation:none;opacity:.8}
}
/* Revelado en un solo fotograma: mientras el dibujo se construye no se
   ve nada (solo el crema de fondo); luego aparece completo, sin cargar
   por partes desde arriba a la izquierda. */
.preload .stage,.preload .tag-wrap,.preload .controls,.preload .ver{visibility:hidden}
/* Cartel «AstroSeec» en arco sobre dos postes, plantado en el césped. */
.hollywood{filter:drop-shadow(0 2px 3px var(--shade))}
.hollywood .post{fill:#8a5a33;stroke:rgba(60,38,18,.35);stroke-width:1}
body.night .hollywood .post{fill:#3f3568;stroke:rgba(10,10,35,.4)}
.hollywood .signword{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:calc(var(--signfs,52) * 1px);fill:#f7f1e3;stroke:rgba(70,50,25,.32);stroke-width:1.4;paint-order:stroke}
body.night .hollywood .signword{fill:#e8e4f5;stroke:rgba(5,5,30,.4)}
.mode-chip .ic{width:15px;height:15px;flex:none}
body:not(.night) .ic-moon{display:none}
body.night .ic-sun{display:none}
/* ── Modo noche: toggle instantáneo, sin animaciones ── */
body.night{background:#10132f}
body.night .sky{background:radial-gradient(95% 70% at 70% 20%,#3a3f8a 0%,#252a69 36%,#161a45 72%,#10132f 100%)}
body.night .c-far{fill:#4a508f}
body.night .c-hill{fill:#3e4487}
body.night .c-roof{fill:#353b7b}
body.night .c-win{fill:#ffd57c}
body.night .c-ridge{fill:#343a7c}
body.night .c-meadow{fill:#2b3071}
body.night .c-river{fill:#5763ae}
body.night .c-ripple{fill:#b9c1f2}
body.night .c-moss{fill:#24295f}
body.night .c-teal{fill:#1a1d4e}
body.night .c-ground{fill:#352b63}
body.night .c-burrow{fill:#110e2a}
body.night .c-stem{fill:#8d86b9}
body.night .c-cap{fill:#7b3e6b}
body.night .c-dot{fill:#aef6e4}
body.night .c-fern{fill:#262d62}
body.night .c-fall1{fill:#5a3766}
body.night .c-fall2{fill:#443d78}
body.night .c-tuft{fill:#2c2a5c}
body.night .c-pebble{fill:#5a5690}
body.night .c-fg{fill:#121439}
body.night .c-fg2{fill:#1b1d4a}
body.night .c-bell{fill:#8a4a86}
body.night .c-bell2{fill:#d7a3d8}
body.night .c-mat{fill:#8f8bb6}
body.night .c-frame{fill:#0b0c27}
body.night .c-fox{fill:#a14f36}
body.night .c-foxc{fill:#d2cbe4}
body.night .c-foxd{fill:#17152f}
body.night .vignette{box-shadow:inset 0 0 20vmin rgba(2,2,20,.55)}
body.night .tag{background:#e7e1ef;color:#2a2644}
body.night .tag .sub{color:#4a4468}
body.night .intro{color:#463f66}
body.night .kicker{color:#7b5aa6}
body.night .chip{background:#e7e1ef;color:#2a2644}
body.night .start-chip{background:#8d4a86;color:#f4ead2}
body.night .tbtn{color:#7b5aa6;box-shadow:inset 0 0 0 2px rgba(123,90,166,.45)}
body.night .tdots i{background:rgba(123,90,166,.4)}
body.night .tdots i.on{background:#8d4a86}
body.night .hang .string{background:linear-gradient(rgba(220,220,255,.08),rgba(220,220,255,.36))}
body.night .ver{color:rgba(220,220,255,.5)}
body.night .grain{opacity:.5}
body.night .sky-grain{opacity:.35}
/* Adaptación web: cartel oculto, solo paisaje + controles */
header.tag-wrap{display:none}
.pager{display:none}
.ver{display:none}
</style>
</head>
<body class="preload">
<main class="stage" id="stage" aria-label="Oración Diaria: un momento con Dios cada día.">
  <div class="sky" id="sky">
    <svg class="sky-grain" aria-hidden="true" focusable="false"><rect width="100%" height="100%" fill="url(#grainPat)"/></svg>
  </div>
  <div class="layer" id="hang" aria-hidden="true"></div>
  <div class="layer cut" id="L1" style="--sh:3" aria-hidden="true"><svg focusable="false"></svg></div>
  <div class="layer cut" id="L2" style="--sh:3" aria-hidden="true"><svg focusable="false"></svg></div>
  <div class="layer cut" id="L3" style="--sh:4" aria-hidden="true"><svg focusable="false"></svg></div>
  <div class="layer cut" id="L4" style="--sh:4" aria-hidden="true"><svg focusable="false"></svg></div>
  <div class="layer cut" id="L5" style="--sh:5" aria-hidden="true"><svg focusable="false"></svg></div>
  <div class="layer cut" id="L6" style="--sh:6" aria-hidden="true"><svg focusable="false"></svg></div>
  <div class="layer cut" id="L7" style="--sh:6" aria-hidden="true"><svg focusable="false"></svg></div>
  <div class="layer cut" id="L8" style="--sh:7" aria-hidden="true"><svg focusable="false"></svg></div>
  <div class="layer" id="hangFront" aria-hidden="true"></div>
  <div class="layer cut" id="L9" style="--sh:9" aria-hidden="true"><svg focusable="false"></svg></div>
  <div class="vignette" aria-hidden="true"></div>
</main>

<header class="tag-wrap" id="tagWrap">
  <span class="tag-string" aria-hidden="true"></span>
  <div class="tag" id="tag">
    <svg class="tag-grain" aria-hidden="true" focusable="false"><rect width="100%" height="100%" fill="url(#grainPat)"/></svg>
    <span class="tag-knot" aria-hidden="true"></span>
    <span class="tag-hole" aria-hidden="true"></span>
    <h1>Oración <em>Diaria</em></h1>
    <span class="rule" aria-hidden="true"></span>
    <p class="sub" id="tagSub">Un momento con Dios cada día.</p>
    <div id="tagIntro" hidden>
      <p class="intro" id="tagText"></p>
    </div>
  </div>
</header>

<nav class="controls" aria-label="Controles">
  <div class="pager" id="pager">
    <button type="button" class="tbtn" id="tagPrev" aria-label="Intro anterior">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <span class="tdots" id="tagDots" aria-hidden="true"></span>
    <button type="button" class="tbtn" id="tagNext" aria-label="Siguiente intro">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
  <div class="row">
    <button type="button" class="chip mode-chip" id="nightBtn" aria-pressed="false">
      <svg class="ic ic-sun" viewBox="-11 -11 22 22" aria-hidden="true" focusable="false"><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"><circle r="4.2"/><path d="M0-8V-6M0 8V6M-8 0H-6M8 0H6M-5.6-5.6l1.4 1.4M5.6 5.6 4.2 4.2M5.6-5.6 4.2-4.2M-5.6 5.6l1.4-1.4"/></g></svg>
      <svg class="ic ic-moon" viewBox="-11 -11 22 22" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3.2-8.6A9 9 0 1 0 8.8 4 7.2 7.2 0 0 1 3.2-8.6z"/></svg>
      <span class="chip-label" id="nightLabel">Noche</span>
    </button>
    <button type="button" class="chip start-chip" id="startBtn">
      <span class="chip-label" id="startLabel">Contáctanos</span>
    </button>
    <button type="button" class="chip load-chip" id="loadChip" hidden>
      <span class="chip-label" id="loadLabel"></span>
      <span class="dots3" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
  </div>
</nav>
<p class="ver" id="ver" hidden></p>
<p class="sr-only" aria-live="polite" id="live"></p>

<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="grainPat" patternUnits="userSpaceOnUse" width="160" height="160"><image id="grainImg" width="160" height="160"/></pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
</svg>

<script>
(() => {
  'use strict';
  /* Modos: intro (onboarding rotativo), splash (carga) y login (Google).
     La escena es una ilustración fija; lo único que cambia en pantalla son
     los textos del cartel y los chips (Comenzar / Google / Cargando). */
  const MODE = 'intro';
  const INTROS = [];
  const WAIT_LABEL = "";
  const SUB_LABEL = "";
  const INTRO_MS = 8000;

  const $ = id => document.getElementById(id);

  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  const rr = (a,b,R) => a + (b-a)*R();
  const q = n => Math.round(n*10)/10;
  const clamp = (v,a,b) => v<a?a:v>b?b:v;

  let W=0, H=0, M=0, U=0, S=0, portrait=false;

  function area(p){let a=0;for(let i=0;i<p.length;i++){const u=p[i],v=p[(i+1)%p.length];a+=u[0]*v[1]-v[0]*u[1];}return a;}
  function orient(p){return area(p)<0?p.slice().reverse():p;}
  function trace(p,j,step,R){
    let s='';const n=p.length;
    for(let i=0;i<n;i++){
      const a=p[i],b=p[(i+1)%n],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,k=Math.max(1,Math.round(L/step)),nx=-dy/L,ny=dx/L;
      for(let t=0;t<k;t++){
        let x=a[0]+dx*t/k,y=a[1]+dy*t/k;
        if(t>0){const o=(R()-.5)*2*j;x+=nx*o;y+=ny*o;}
        s+=(s?'L':'M')+q(x)+' '+q(y);
      }
    }
    return s+'Z';
  }
  const cut  = (p,j,step,R) => trace(orient(p),j,step,R);
  const hole = (p,j,step,R) => trace(orient(p).slice().reverse(),j,step,R);
  function poly(p){p=orient(p);let s='M'+q(p[0][0])+' '+q(p[0][1]);for(let i=1;i<p.length;i++)s+='L'+q(p[i][0])+' '+q(p[i][1]);return s+'Z';}
  function circ(cx,cy,r,n){const p=[];n=n||Math.max(8,Math.round(r*1.4));for(let i=0;i<n;i++){const a=i/n*Math.PI*2;p.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]);}return p;}
  function wave(base,amps,lens,R){const ph=amps.map(()=>R()*Math.PI*2);return x=>{let y=base;for(let i=0;i<amps.length;i++)y+=amps[i]*Math.sin(x/lens[i]*Math.PI*2+ph[i]);return y;};}
  function ridge(fn,bottom,step,j,R){const p=[];for(let x=-M;x<=W+M+step;x+=step)p.push([x,fn(x)+(R()-.5)*2*j]);p.push([W+M+step,bottom],[-M,bottom]);return poly(p);}

  function pine(cx,by,h,w,R){
    const n=h>420?9:h>160?7:h>70?5:h>32?4:3;
    const trunkH=h*.09,crown=h-trunkH,tip=by-h,st=crown/(n+.45);
    const j=Math.max(.45,h/520),step=Math.max(5,h/70),lean=(R()-.5)*w*.12;
    let d='';
    for(let i=0;i<n;i++){
      const top=tip+i*st,bot=tip+(i+1.45)*st,k=(i+1)/n;
      const base=w*.5*(.26+.74*Math.pow(k,.9));
      const hr=base*(1+(R()-.5)*.16),hl=base*(1+(R()-.5)*.16),droop=st*.14;
      const cx0=cx+lean*(1-k);
      d+=cut([[cx0,top],[cx+hr,bot+(R()-.5)*droop],[cx+hr*.5,bot-st*.28],[cx,bot-st*.18],[cx-hl*.5,bot-st*.28],[cx-hl,bot+(R()-.5)*droop]],j,step,R);
    }
    const tw=Math.max(1.4,w*.055);
    d+=cut([[cx-tw,by+4],[cx-tw*.75,by-trunkH-st*.6],[cx+tw*.75,by-trunkH-st*.6],[cx+tw,by+4]],.3,8,R);
    return d;
  }
  function blade(bx,by,h,lean,wb){
    const L=[],Rt=[];
    for(let i=0;i<=6;i++){const t=i/6,x=bx+lean*t*t,y=by-h*t,hw=wb*.5*(1-t)*(1-t*.15);L.push([x-hw,y]);if(i<6)Rt.push([x+hw,y]);}
    return poly(L.concat(Rt.reverse()));
  }
  function bankFn(xa,xb,yEdge,wob){
    return x=>{const s=clamp((x-xa)/(xb-xa),0,1);return yEdge+wob(x)+Math.pow(s,3)*(H+M-yEdge)*1.02;};
  }

  function build(){
    const R = mulberry32(1847);

    const far = wave(H*P(.395,.43),[H*.034,H*.016,H*.007],[W*1.15,W*.43,W*.16],R);
    const d1 = ridge(far,H+M,9,.9,R);
    svgOf('L1').innerHTML = `<path class="c-far" d="${d1}"/><path class="grain" d="${d1}"/>`;
    const hill = wave(H*P(.47,.5),[H*.036,H*.014,H*.006],[W*.9,W*.34,W*.13],R);
    let d2 = ridge(hill,H+M,9,.9,R);
    const phs = R()*6;
    for(let x=-M; x<W+M; x+=rr(5,15,R)){
      if(Math.sin(x/W*8.5+phs)+Math.sin(x/W*21+phs*2)*.5 > .35){const h=rr(2.1,4.2,R)*U;d2+=pine(x,hill(x)+3,h,h*.55,R);}

      d2+=cut([[cx+s*.2,by-s*.8],[cx+s*.2,by-s*1.12],[cx+s*.36,by-s*1.12],[cx+s*.36,by-s*.7]],.3,4,R);

      for(const wx of [-.26,.18]){wins+=poly([[cx+wx*s,by-s*.42],[cx+(wx+.15)*s,by-s*.42],[cx+(wx+.15)*s,by-s*.24],[cx+wx*s,by-s*.24]]);}
    }
    /* Cartel «AstroSeec» en arco sobre dos postes cortos. La parte superior de
       cada poste se calcula sobre la curva del arco, de modo que toca la base
       de las letras justo debajo de ellas. */
    const fs=W*.052, ay=H*.60, acy=H*.535, pw=W*.013, postH=H*.05;
    const ax0=W*.25, ax1=W*.59;
    const arcY=x=>{const t=(x-ax0)/(ax1-ax0);return ay+2*t*(1-t)*(acy-ay);};
    const px1=W*.34, px2=W*.50;
    const py1=arcY(px1)-fs*.04, py2=arcY(px2)-fs*.04;
    const sign=`<defs><path id="signArc" d="M ${q(ax0)} ${q(ay)} Q ${q((ax0+ax1)/2)} ${q(acy)} ${q(ax1)} ${q(ay)}"/></defs><g class="hollywood" style="--signfs:${q(fs)}"><rect class="post" x="${q(px1-pw/2)}" y="${q(py1)}" width="${q(pw)}" height="${q(postH)}"/><rect class="post" x="${q(px2-pw/2)}" y="${q(py2)}" width="${q(pw)}" height="${q(postH)}"/><text class="signword"><textPath href="#signArc" startOffset="50%" text-anchor="middle">AstroSeec</textPath></text></g>`;
    svgOf('L2').innerHTML = `<path class="c-hill" d="${d2}"/><path class="c-roof" d="${roofs}"/><path class="grain" d="${d2}${roofs}"/><path class="c-win" d="${wins}"/>`;
    const rg = wave(H*P(.545,.565),[H*.014,H*.007],[W*.7,W*.23],R);
    let d3 = ridge(rg,H+M,9,.9,R);
    for(let x=-M; x<W+M; ){const h=rr(3.6,7.8,R)*U*(portrait?1.15:1),w=h*rr(.46,.58,R);d3+=pine(x,rg(x)+4,h,w,R);x+=w*rr(.42,.8,R);}
    svgOf('L3').innerHTML = `<path class="c-ridge" d="${d3}"/><path class="grain" d="${d3}"/>`;
    const md = wave(H*P(.6,.615),[H*.008,H*.004],[W*.8,W*.25],R);
    const d4 = ridge(md,H+M,10,.6,R);
    const yBot=H*P(.86,.84), N=40, amp=W*P(.12,.2), ph=R()*.7-.2, cl=[];
    const Lb=[],Rb=[];
    for(let i=0;i<=N;i++){

    let d5=bankPath(bL5,-M,xL5,R)+bankPath(bR5,W+M,xR5,R);
    const pinesAlong=(fn,xa,xb,hMin,hMax,wr,fromEdge)=>{let d='';for(let x=xa;x<xb;){const s=fromEdge(x),h=rr(hMin,hMax,R)*(1-s*.5),w=Math.min(h*wr,W*P(.14,.2));if(fn(x)<H*.95)d+=pine(x,fn(x)+5,h,w,R);x+=w*rr(.4,.7,R);}return d;};

    svgOf('L5').innerHTML = `<path class="c-moss" d="${d5}"/><path class="grain" d="${d5}"/>`;

      ? [[-.06,.9],[.12,.52],[1.05,.86],[.9,.5]]
      : [[.015,1.02],[.098,.7],[.975,.96],[.9,.64]];
    for(const [gx,gh] of giants){const x=W*gx,h=H*gh,w=Math.min(h*.4,W*P(.2,.36));d6+=pine(x,(gx<.5?bL6:bR6)(x)+8,h,w,R);}
    svgOf('L6').innerHTML = `<path class="c-teal" d="${d6}"/><path class="grain" d="${d6}"/>`;
    const g7w = wave(H*P(.785,.8),[H*.011,H*.006],[W*.95,W*.3],R);
    const g7 = g7w;
    groundAt = g7;
    let d7 = ridge(g7,H+M,8,.7,R);
    let tufts='';
    for(let x=-M;x<W+M;x+=rr(18,60,R)){const y=g7(x)+2,n=3+Math.floor(R()*3);for(let k=0;k<n;k++)tufts+=blade(x+k*2.2,y+2,rr(.9,2.1,R)*U,rr(-.6,.6,R)*U,rr(2,3.4,R));}
    let stems='',caps='',dots='';
    const clusters = P([[.1,4],[.6,3],[.87,5],[.38,2]],[[.12,3],[.64,3],[.9,2]]);
    for(const [cf,n] of clusters){
      for(let k=0;k<n;k++){
        const x=W*cf+(k-(n-1)/2)*U*rr(1.4,2.6,R),s=U*rr(1.1,3.1,R)*(k===Math.floor(n/2)?1.25:1)*P(1,1.25);
        const m=mushroom(x,g7(x)+s*.18,s,R);stems+=m.stem;caps+=m.cap;dots+=m.dots;
      }
    }
    let ferns='';
    for(const [ff,sz,dr2] of P([[.03,13,1],[.33,9,-1],[.47,7,1],[.72,10,1],[.96,12,-1]],[[.04,12,1],[.42,9,-1],[.78,10,1]])){
      const x=W*ff;ferns+=fern(x,g7(x)+4,sz*U*P(1,1.25),dr2,R);ferns+=fern(x+U*.8,g7(x)+4,sz*U*.7*P(1,1.25),-dr2,R);

    for(let i=0;i<9;i++){const x=rr(.05,.95,R)*W,y=g7(x)+rr(.6,3.5,R)*U,r=rr(.3,.75,R)*U;pebbles+=cut(circ(x,y,r,9).map(([a,b])=>[a,y+(b-y)*.6]),.25,3,R);}

      const x=rr(-.02,1.02,R)*W,top=g7(x)+U*2.2,y=top+Math.pow(R(),1.3)*(H*.965-top),sz=rr(.45,.9,R)*U,a=R()*Math.PI,ca=Math.cos(a),sa=Math.sin(a);
      const lp=[[-1,0],[-.3,-.42],[.35,-.36],[1,0],[.3,.4],[-.35,.36]].map(([u,v])=>[x+(u*ca-v*sa*.8)*sz,y+(u*sa+v*ca*.8)*sz*.62]);
      if(R()<.6)fall1+=cut(lp,.2,3,R);else fall2+=cut(lp,.2,3,R);

    svgOf('L7').innerHTML = `<path class="c-ground" d="${d7}"/><path class="c-fall1" d="${fall1}"/><path class="c-fall2" d="${fall2}"/><path class="c-tuft" d="${tufts}${lowT}"/><path class="c-pebble" d="${pebbles}"/><path class="c-fern" d="${ferns}"/><path class="c-stem" d="${stems}"/><path class="c-cap" d="${caps}"/><path class="grain" d="${d7}${stems}${caps}"/><path class="c-dot glowdots" d="${dots}"/><g id="foxG">${FOX}</g>`;
    /* Zorro plantado sobre el terreno (estático). */
    const foxS=clamp(U*(portrait?.78:.72),5,11.5)/8, foxX=W*.46, foxY=g7(foxX);
    $('foxG').setAttribute('transform',`translate(${q(foxX)} ${q(foxY)}) scale(${(foxS).toFixed(3)})`);
    const g8 = wave(H*P(.945,.955),[H*.008,H*.005],[W*.6,W*.2],R);

      const s=Math.abs(x-W/2)/(W/2),hm=H*(.018+P(.23,.2)*Math.pow(clamp(s,0,1.2),2.4)),h=hm*rr(.35,1,R),lean=rr(-.38,.38,R)*h,wb=rr(4,9,R)*(U/11+.4);

    const e=Math.max(10,Math.min(W,H)*.024), rad=e*3;
    const outer=[[-M-4,-M-4],[W+M+4,-M-4],[W+M+4,H+M+4],[-M-4,H+M+4]];

      const seg=(ax,ay,bx,by)=>{const L=Math.hypot(bx-ax,by-ay),k=Math.max(1,Math.round(L/11));for(let t=0;t<k;t++){const u=t/k;p.push([ax+(bx-ax)*u+(R()-.5)*wob,ay+(by-ay)*u+(R()-.5)*wob]);}};

  }

  /* Sol (día) o luna y estrellas (noche) colgando fijos del cielo, más las
     nubes. Semilla propia por estado: el toggle regenera exactamente los
     mismos cuerpos. En vertical el cartel centra el ancho, así que el sol y
     las nubes cuelgan del cielo abierto del valle a sus costados. */
  function buildHangers(){
    const R=mulberry32(night?4242:777);
    const hang=$('hang'), m=Math.min(W,H);
    const items=[];
    if(night){
      const n=Math.round(W/90);
      for(let i=0;i<n;i++){
        const ss=rr(6,12,R)*(m/400);
        items.push({x:rr(.06,.94,R)*W,y:rr(.05,.34,R)*H,h:ss,html:`<svg viewBox="-8 -8 16 16" width="${q(ss)}" height="${q(ss)}"><path fill="#e8b865" d="M0-7 1.9-1.9 7 0 1.9 1.9 0 7-1.9 1.9-7 0-1.9-1.9Z"/></svg>`});
      }
    }
    const orbD=clamp(m*.16,70,168), orbX=W*(portrait?.8:.7), orbY=H*(portrait?.4:.2);
    const orbSvg = night
      ? `<svg viewBox="-50 -50 100 100" width="${q(orbD)}" height="${q(orbD)}"><path fill="#f5ecd6" d="${cut(circ(0,0,44,44),.5,5,R)}"/><path fill="#e3d4b3" d="${cut(circ(-14,-10,9,14),.4,3,R)}${cut(circ(12,8,6,10),.3,3,R)}${cut(circ(-6,18,5,9),.3,3,R)}${cut(circ(18,-16,4,8),.3,3,R)}"/><path fill="url(#grainPat)" d="${cut(circ(0,0,44,40),.1,50,R)}"/></svg>`
      : (()=>{let rays=[];for(let i=0;i<44;i++){const a=i/44*Math.PI*2,r=i%2?47:58;rays.push([Math.cos(a)*r,Math.sin(a)*r]);}
          return `<svg viewBox="-62 -62 124 124" width="${q(orbD)}" height="${q(orbD)}"><path fill="#c8642d" d="${cut(rays,.5,5,R)}"/><path fill="#d9a45b" d="${cut(circ(0,0,42,40),.5,5,R)}"/><path fill="#e6b772" d="${cut(circ(-4,-5,29,30),.4,5,R)}"/><path fill="url(#grainPat)" d="${cut(circ(0,0,42,40),.1,50,R)}"/></svg>`;})();
    items.push({x:orbX,y:orbY,h:orbD,html:orbSvg});
    const cloudFill = night ? '#c7c9ec' : '#fbf6ea';
    const cloudShape=(sc)=>{let d='';for(const [cx,cy,r] of [[-30,4,17],[-9,-9,24],[16,-5,20],[35,6,13]])d+=cut(circ(cx*sc,cy*sc,r*sc,22),.5,5,R);d+=cut([[-46*sc,20*sc],[-46*sc,6*sc],[48*sc,6*sc],[48*sc,20*sc]],.5,6,R);return d;};
    const clouds=portrait?[[.3,.39,.7],[.62,.375,.6]]:[[.44,.12,1],[.575,.305,.62]];
    clouds.forEach(([cx,cy,sc])=>{const cw=m*.19*sc;items.push({front:true,x:W*cx,y:H*cy,h:cw*.5,html:`<svg viewBox="-52 -36 104 60" width="${q(cw)}" height="${q(cw*.58)}"><path fill="${cloudFill}" d="${cloudShape(1)}"/><path fill="rgba(120,90,40,.16)" d="${cut([[-46,20],[-46,13],[48,13],[48,20]],.4,6,R)}"/></svg>`});});
    const tpl=it=>{
      const len=it.y+M;
      return `<div class="hang" style="left:${q(it.x+M)}px;--len:${q(len)}px"><span class="string"></span><div class="obj">${it.html}</div></div>`;
    };
    hang.innerHTML=items.filter(it=>!it.front).map(tpl).join('');
    $('hangFront').innerHTML=items.filter(it=>it.front).map(tpl).join('');
  }

  function makeGrain(){
    const c=document.createElement('canvas');c.width=c.height=160;const g=c.getContext('2d'),id=g.createImageData(160,160),d=id.data;
    for(let i=0;i<d.length;i+=4){const n=Math.random();if(n<.5){d[i]=74;d[i+1]=52;d[i+2]=30;d[i+3]=(.5-n)*46;}else{d[i]=255;d[i+1]=251;d[i+2]=240;d[i+3]=(n-.5)*40;}}
    g.putImageData(id,0,0);
    for(let k=0;k<90;k++){g.strokeStyle=k%3?'rgba(255,252,242,.2)':'rgba(96,66,36,.13)';g.lineWidth=.6;g.beginPath();const x=Math.random()*160,y=Math.random()*160,a=Math.random()*6.28,l=4+Math.random()*14;g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(a+.6)*l*.5,y+Math.sin(a+.6)*l*.5,x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();}
    return c.toDataURL();
  }

  /* ── Textos de intro dentro del cartel colgante (solo modo intro) ── */
  const startBtn=$('startBtn'),startLabel=$('startLabel');
  const tagSub=$('tagSub'),tagIntro=$('tagIntro');
  let introI=0,introTimer=0,introBusy=false;

  if(MODE==='intro'&&INTROS.length){
    tagSub.remove();
    tagIntro.hidden=false;
  }else{
    tagIntro.remove();
    if(SUB_LABEL)tagSub.textContent=SUB_LABEL;
  }
  if(MODE==='splash'){
    startBtn.remove();
    $('pager').remove();
    $('loadChip').hidden=false;
    $('ver').hidden=false;
  }else{
    $('loadChip').remove();
    if(MODE==='login')$('pager').remove();
  }

  function buildDots(){
    const dots=$('tagDots');
    dots.textContent='';
    INTROS.forEach((_,n)=>{
      const d=document.createElement('i');
      if(n===introI)d.className='on';
      dots.appendChild(d);
    });
  }
  function paintIntro(){
    const it=INTROS[introI];
    if(!it)return;
    $('tagText').textContent=it.text;
    $('tagText').classList.remove('out');
    [...$('tagDots').children].forEach((d,n)=>d.classList.toggle('on',n===introI));
    $('live').textContent=it.label;
  }
  function showIntro(n,manual){
    if(introBusy||INTROS.length<2)return;
    introI=(n+INTROS.length)%INTROS.length;
    introBusy=true;
    $('tagText').classList.add('out');
    setTimeout(()=>{paintIntro();introBusy=false;},420);
    [...$('tagDots').children].forEach((d,k)=>d.classList.toggle('on',k===introI));
    armIntro();
  }
  function armIntro(){
    clearTimeout(introTimer);
    if(INTROS.length<2)return;
    introTimer=setTimeout(()=>showIntro(introI+1),INTRO_MS);
  }
  if(MODE==='intro'&&INTROS.length>1){
    buildDots();paintIntro();armIntro();
    $('tagNext').addEventListener('click',()=>showIntro(introI+1,true));
    $('tagPrev').addEventListener('click',()=>showIntro(introI-1,true));
    $('tag').addEventListener('pointerenter',()=>clearTimeout(introTimer));
    $('tag').addEventListener('pointerleave',armIntro);
  }
  /* Reuso del WebView: reinicia el tour al primer texto sin recargar. */
  window.resetIntro=function(){
    const tt=$('tagText'),td=$('tagDots');
    if(MODE!=='intro'||!INTROS.length||!tt||!td)return;
    introI=0;introBusy=false;clearTimeout(introTimer);
    tt.classList.remove('out');
    buildDots();paintIntro();armIntro();
  };

  startBtn.addEventListener('click',()=>{
    if(MODE==='intro'&&window.AndroidIntro)AndroidIntro.finish();
    else if(MODE==='login'&&window.AndroidLogin)AndroidLogin.start();
  });
  /* Estado de conexión del login: la app llama loginLoading(true/false). */
  window.loginLoading=function(on){
    if(MODE!=='login')return;
    startBtn.classList.toggle('busy',!!on);
    startLabel.textContent=on?(WAIT_LABEL||'…'):startLabel.dataset.label;
  };
  if(MODE==='login')startLabel.dataset.label=startLabel.textContent;

  let rT=0;
  let lastW=0,lastH=0;
  function checkSize(){
    if(innerWidth===lastW&&innerHeight===lastH)return;
    lastW=innerWidth;lastH=innerHeight;
    build();
  }
  window.addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(checkSize,120);});

  /* ── Modo noche: toggle instantáneo (sin animaciones). El estado se
     recuerda y se aplica ANTES de construir, para que el primer fotograma
     ya salga en el modo elegido. ── */
  let night=false;
  try{night=localStorage.getItem('od-night')==='1'}catch(e){}
  const nightBtn=$('nightBtn');
  if(night)document.body.classList.add('night');
  if(MODE!=='splash'){
    nightBtn.setAttribute('aria-pressed',String(night));
    $('nightLabel').textContent=night?'Día':'Noche';
    nightBtn.addEventListener('click',()=>{
      night=!night;
      document.body.classList.toggle('night',night);
      nightBtn.setAttribute('aria-pressed',String(night));
      $('nightLabel').textContent=night?'Día':'Noche';
      buildHangers(); // sol↔luna y estrellas, en un solo repintado
      try{localStorage.setItem('od-night',night?'1':'0')}catch(e){}
    });
  }else{
    nightBtn.remove();
  }

  const notify=()=>{try{parent.postMessage(night?'diorama:noche':'diorama:dia','*')}catch(e){}};
  notify();
  nightBtn.addEventListener('click',notify);
  startBtn.addEventListener('click',()=>{try{parent.postMessage('diorama:contacto','*')}catch(e){}});

  checkSize();
  try{$('grainImg').setAttribute('href',makeGrain());}catch(e){}
  /* Dibujo completo: revelar la escena entera en un solo fotograma. */
  document.body.classList.remove('preload');
  /* El WebView a veces se adjunta con altura provisional (ventana en
     animación, insets pendientes): se vuelve a comprobar el tamaño unos
     instantes después y solo se reconstruye si cambió. */
  setTimeout(checkSize,400);
  setTimeout(checkSize,1200);
  setTimeout(checkSize,2500);
})();
</script>
</body>
</html>
