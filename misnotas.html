<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Notas - AstroSeec</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #e5e0d8; --text-color: #0d1217; --accent: #2c3e50; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: rgba(255,255,255,0.4); padding: 50px; border-radius: 30px; backdrop-filter: blur(10px); }
        h1 { font-size: 3rem; margin-bottom: 20px; }
        p { line-height: 1.8; margin-bottom: 20px; }
        .btn { background: var(--text-color); color: white; padding: 15px 30px; border-radius: 50px; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mis Notas</h1>
        <p>Tu diario privado y seguro. Escribe tus pensamientos, organiza tus momentos y protege tu intimidad con acceso biométrico o PIN. Simple, seguro y siempre contigo.</p>
        <a href="https://play.google.com/store/apps/details?id=com.misnotasdiario.app" class="btn" target="_blank">Descargar App</a>
        <br><br>
        <a href="index.html">← Volver</a>
    </div>
</body>
</html>
